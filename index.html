<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وارش | بازار آنلاین خدمات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F7FB;
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-soft: #DBEAFE;
      --dark: #111827;
      --text: #1F2937;
      --muted: #6B7280;
      --line: #E5E7EB;
      --white: #FFFFFF;
      --success: #16A34A;
      --success-soft: #DCFCE7;
      --warn: #F59E0B;
      --warn-soft: #FEF3C7;
      --danger: #DC2626;
      --danger-soft: #FEE2E2;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
      --shadow-sm: 0 2px 10px rgba(17, 24, 39, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    body.menu-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }
    .container { width: 100%; max-width: 1120px; padding-inline: 16px; margin: 0 auto; }
    #app { max-width: 100%; overflow-x: hidden; }

    .header {
      position: sticky; top: 0; z-index: 80;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; min-height: 72px; position: relative;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; color: var(--dark); flex: 0 0 auto; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(145deg, #2563EB, #1E3A8A);
      display: grid; place-items: center; box-shadow: var(--shadow-sm);
    }
    .nav {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end;
      position: fixed; top: 0; left: 0; right: 0;
      height: 72px;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px 0 16px;
      padding-right: 180px;
      box-sizing: border-box;
      z-index: 60;
      pointer-events: none;
    }
    .nav a, .nav button.linkish { pointer-events: auto; }
    #authNav { display: contents; }
    .nav a, .nav button.linkish {
      background: none; border: 0; cursor: pointer;
      padding: 8px 12px; border-radius: 10px; color: var(--text); font-weight: 500;
      white-space: nowrap;
    }
    .nav a:hover, .nav button.linkish:hover, .nav a.active { background: var(--primary-soft); color: var(--primary); }
    .cart-link { position: relative; padding-left: 18px; }
    .nav-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(17,24,39,.4); z-index: 70;
    }
    .nav-backdrop.show { display: block; }
    .badge-count {
      position: absolute; top: 2px; left: 2px;
      min-width: 18px; height: 18px; padding: 0 5px;
      background: var(--danger); color: #fff; border-radius: 999px;
      font-size: 11px; display: grid; place-items: center;
    }
    .btn {
      border: 0; cursor: pointer; border-radius: 12px;
      padding: 10px 16px; font-weight: 600; transition: .2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn-soft { background: var(--primary-soft); color: var(--primary); }
    .btn-sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
    .btn-block { width: 100%; }

    .hero {
      padding: 48px 0 28px;
    }
    .hero-card {
      background: linear-gradient(135deg, #EFF6FF 0%, #FFFFFF 55%, #F8FAFC 100%);
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 42px 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .hero h1 { font-size: clamp(26px, 4vw, 42px); color: var(--dark); margin-bottom: 8px; }
    .hero p { color: var(--muted); font-size: 18px; margin-bottom: 22px; }
    .search-box {
      display: flex; gap: 8px; max-width: 680px; margin: 0 auto;
      background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 8px;
      box-shadow: var(--shadow-sm);
    }
    .search-box input {
      flex: 1; min-width: 0; border: 0; outline: none; padding: 12px 14px; font-size: 16px; background: transparent;
    }
    .cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
    .chip {
      background: #fff; border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 500;
    }
    .chip.active, .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

    .section { padding: 28px 0 48px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
    .section-head h2 { font-size: 22px; color: var(--dark); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
    .card {
      background: #fff; border: 1px solid #EEF2F7; border-radius: var(--radius);
      box-shadow: var(--shadow-sm); overflow: hidden;
    }
    .service-cover {
      height: 148px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 28px;
      position: relative;
    }
    .service-body { padding: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    .price { color: var(--primary); font-weight: 800; font-size: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stars { color: #F59E0B; font-weight: 700; }

    .filters { display: grid; grid-template-columns: 240px 1fr; gap: 18px; }
    .side { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); height: fit-content; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; outline: none;
    }
    .field textarea { min-height: 110px; resize: vertical; }

    .detail { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; }
    .cover-lg { height: 320px; border-radius: var(--radius); display: grid; place-items: center; color: #fff; font-size: 48px; font-weight: 800; }
    .trust {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0;
    }
    .trust span {
      background: var(--bg); border-radius: 12px; padding: 10px; font-size: 13px;
    }
    .level-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--warn-soft); color: #92400E; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700;
    }
    .verified { background: var(--success-soft); color: #166534; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }

    .table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; }
    .table th, .table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
    .table th { background: #F8FAFC; color: var(--muted); font-weight: 600; }

    .status {
      display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700;
    }
    .s-pending { background: var(--warn-soft); color: #92400E; }
    .s-paid { background: #E0E7FF; color: #3730A3; }
    .s-progress { background: var(--primary-soft); color: #1D4ED8; }
    .s-delivered { background: #E0F2FE; color: #075985; }
    .s-revise { background: #FCE7F3; color: #9D174D; }
    .s-done { background: var(--success-soft); color: #166534; }
    .s-cancel { background: var(--danger-soft); color: #991B1B; }
    .s-dispute { background: #F3E8FF; color: #6B21A8; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
    .stat b { display: block; font-size: 22px; color: var(--dark); }

    .auth-wrap { max-width: 440px; margin: 40px auto; }
    .footer { padding: 28px 0 40px; color: var(--muted); text-align: center; font-size: 13px; }
    .toast-wrap { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 80; display: grid; gap: 8px; pointer-events: none; }
    .toast {
      pointer-events: auto; max-width: 420px; margin-right: auto;
      background: var(--dark); color: #fff; border-radius: 14px; padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .toast.ok { background: #14532D; }
    .toast.err { background: #7F1D1D; }
    .hidden { display: none !important; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
    .menu-btn { display: none; z-index: 80; position: relative; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .empty { background: #fff; border-radius: var(--radius); padding: 36px; text-align: center; color: var(--muted); }
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 980px) {
      .filters, .detail { grid-template-columns: 1fr; }
      .trust { grid-template-columns: 1fr; }
      .menu-btn { display: inline-flex; }
      .nav {
        display: flex; flex-direction: column; flex-wrap: nowrap;
        align-items: stretch; justify-content: flex-start;
        position: fixed;
        top: 0; right: 0; bottom: 0; left: auto;
        width: min(86vw, 340px);
        max-width: 340px;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        background: #fff;
        border-left: 1px solid var(--line);
        padding: 88px 16px 28px;
        gap: 8px;
        transform: translateX(100%);
        transition: transform .22s ease;
        z-index: 75;
        box-shadow: var(--shadow);
        overflow-y: auto;
        pointer-events: auto;
      }
      .nav.open { transform: translateX(0); }
      .nav a, .nav button.linkish {
        width: 100%;
        text-align: right;
        white-space: normal;
        padding: 12px 14px;
        font-size: 16px;
      }
      .cover-lg { height: 200px; }
      .hero-card { padding: 28px 16px; }
      .search-box { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="#/" data-nav>
        <span class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M4 5.5L12 20L20 5.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.2 5.5H15.8" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        وارش

  <nav class="nav" id="mainNav" aria-label="منوی اصلی">

  <main class="container" id="app"></main>
  <footer class="footer">وارش — بازار آنلاین خدمات · نسخه آزمایشی محلی</footer>
  <div class="toast-wrap" id="toasts"></div>

  <script>
  (function () {
    const KEYS = {

      session: "varesh_session_v2"
    };
    const FEE_RATE = 0.1;
    const CATS = ["طراحی", "برنامه‌نویسی", "تولید محتوا", "ترجمه", "بازاریابی", "ویدیو", "نویسندگی"];
    const STATUS = {

      revise: "s-revise", done: "s-done", cancel: "s-cancel", dispute: "s-dispute"
    };
    const COVERS = {
      "طراحی": ["#2563EB", "#1E3A8A", "ط"],
      "برنامه‌نویسی": ["#0F766E", "#134E4A", "ب"],
      "تولید محتوا": ["#7C3AED", "#4C1D95", "م"],
      "ترجمه": ["#C2410C", "#7C2D12", "ت"],
      "بازاریابی": ["#DB2777", "#9D174D", "ب"],
      "ویدیو": ["#0369A1", "#0C4A6E", "و"],
      "نویسندگی": ["#4F46E5", "#312E81", "ن"]
    };

    const db = {
      get(k, fallback) {
        try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
        catch { return fallback; }
      },
      set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    };

    function uid(prefix) {
      return prefix + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
    }
    function hash(str) {
      let h = 5381;
      for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
      return "h" + (h >>> 0).toString(16);
    }
    function money(n) { return Number(n || 0).toLocaleString("fa-IR") + " تومان"; }
    function today() { return new Date().toISOString(); }
    function faDate(iso) {
      try { return new Date(iso).toLocaleDateString("fa-IR"); } catch { return iso; }
    }
    function levelOf(completed) {
      if (completed >= 50) return "برتر";
      if (completed >= 20) return "حرفه‌ای";
      if (completed >= 5) return "فعال";
      return "تازه‌کار";
    }
    function toast(msg, type) {
      const wrap = document.getElementById("toasts");
      const el = document.createElement("div");
      el.className = "toast " + (type || "ok");
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }
    function currentUser() {
      const s = db.get(KEYS.session, null);
      if (!s) return null;
      return db.get(KEYS.users, []).find(u => u.id === s.userId) || null;
    }
    function requireRole(roles) {
      const u = currentUser();
      if (!u || !roles.includes(u.role)) return null;
      return u;
    }

    function seedIfNeeded() {
      if (db.get(KEYS.users, null)) return;
      const admin = {

        cancelPercent: 5, reviewCount: 21
      };
      const p3 = {
        id: "u_p3", name: "نگار احمدی", email: "negar@varesh.ir", pass: hash("123456"),
        role: "provider", bio: "تولید محتوای فارسی و استراتژی محتوا.",
        avatar: "", verified: false, joinedAt: "2026-01-18T10:00:00.000Z",
        rating: 4.3, completedOrders: 8, onTimePercent: 88, responseHours: 6,
        cancelPercent: 7, reviewCount: 5
      };
      const c1 = {
        id: "u_c1", name: "مشتری نمونه", email: "user@varesh.ir", pass: hash("123456"),

      };

      const services = [
        { id: "s1", providerId: p1.id, title: "طراحی رابط کاربری وب‌سایت", desc: "طراحی UI مدرن، ریسپانسیو و آماده تحویل به تیم توسعه.", category: "طراحی", price: 2500000, deliveryDays: 7, image: "", rating: 4.8, orderCount: 62, createdAt: "2026-06-01T10:00:00.000Z", status: "active" },

    function users() { return db.get(KEYS.users, []); }
    function saveUsers(list) { db.set(KEYS.users, list); }
    function services() { return db.get(KEYS.services, []); }
    function saveServices(list) { db.set(KEYS.services, list); }
    function orders() { return db.get(KEYS.orders, []); }
    function saveOrders(list) { db.set(KEYS.orders, list); }
    function providerOf(id) { return users().find(u => u.id === id); }
    function serviceOf(id) { return services().find(s => s.id === id); }

    function cartOf(uid) {
      const all = db.get(KEYS.cart, {});
      return all[uid] || [];
    }
    function saveCart(uid, items) {
      const all = db.get(KEYS.cart, {});
      all[uid] = items;
      db.set(KEYS.cart, all);
      updateCartBadge();
    }
    function favOf(uid) {
      const all = db.get(KEYS.favorites, {});
      return all[uid] || [];
    }
    function saveFav(uid, ids) {
      const all = db.get(KEYS.favorites, {});
      all[uid] = ids;
      db.set(KEYS.favorites, all);
    }

    function guestCartKey() { return "guest"; }
    function activeCartId() {
      const u = currentUser();
      return u ? u.id : guestCartKey();
    }

    function addToCart(serviceId, qty) {
      const u = currentUser();
      if (u && u.role === "admin") { toast("مدیر امکان خرید ندارد", "err"); return; }
      if (u && u.role === "provider") {
        const s = serviceOf(serviceId);
        if (s && s.providerId === u.id) { toast("نمی‌توانید خدمت خودتان را سفارش دهید", "err"); return; }
      }
      const id = activeCartId();
      const items = cartOf(id);
      const found = items.find(i => i.serviceId === serviceId);
      if (found) found.qty += (qty || 1);
      else items.push({ serviceId, qty: qty || 1 });
      saveCart(id, items);
      toast("✓ خدمت با موفقیت به سبد اضافه شد");
    }

    function updateCartBadge() {
      const items = cartOf(activeCartId());
      const n = items.reduce((s, i) => s + i.qty, 0);
      const el = document.getElementById("cartBadge");
      if (!el) return;
      el.textContent = n;
      el.classList.toggle("hidden", n === 0);
    }

    function coverStyle(cat) {
      const c = COVERS[cat] || ["#2563EB", "#1E3A8A", "و"];
      return 'style="background:linear-gradient(135deg,' + c[0] + ',' + c[1] + ')"';
    }
    function coverLetter(cat) {
      return (COVERS[cat] || ["", "", "و"])[2];
    }

    function trustBlock(p) {
      if (!p) return "";
      return `
        <div class="trust">

          <span>🛒 ${(p.completedOrders || 0).toLocaleString("fa-IR")} سفارش تکمیل‌شده</span>
          <span>⏱️ ${(p.onTimePercent || 0).toLocaleString("fa-IR")}٪ تحویل به‌موقع</span>
          <span>💬 پاسخ‌گویی حدود ${(p.responseHours || 0).toLocaleString("fa-IR")} ساعت</span>
          <span>🔄 لغو ${(p.cancelPercent || 0).toLocaleString("fa-IR")}٪</span>

    function serviceCard(s) {
      const p = providerOf(s.providerId) || { name: "نامشخص" };
      const img = s.image

    function esc(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function renderNav() {
      const u = currentUser();
      const box = document.getElementById("authNav");
      if (!u) {

      } else if (u.role === "admin") {
        box.innerHTML = `<a href="#/admin" data-nav>پنل مدیریت</a><button class="linkish" id="logoutBtn" type="button">خروج</button>`;

    function parseRoute() {
      const raw = (location.hash || "#/").replace(/^#/, "");
      const noQuery = raw.split("?")[0];
      const parts = noQuery.split("/").filter(Boolean);
      return { parts, path: parts.join("/") };
    }

    function servicesView(query) {
      const q = (query.q || "").trim();
      const cat = query.cat || "";
      const min = Number(query.min || 0);
      const max = Number(query.max || 0);
      const minRate = Number(query.rate || 0);
      const sort = query.sort || "new";
      let list = services().filter(s => s.status === "active");
      if (q) list = list.filter(s => (s.title + s.desc + s.category).includes(q));
      if (cat) list = list.filter(s => s.category === cat);
      if (min) list = list.filter(s => s.price >= min);
      if (max) list = list.filter(s => s.price <= max);
      if (minRate) list = list.filter(s => (s.rating || 0) >= minRate);
      if (sort === "new") list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      if (sort === "popular") list.sort((a, b) => (b.orderCount || 0) - (a.orderCount || 0));
      if (sort === "cheap") list.sort((a, b) => a.price - b.price);
      return `

          <div class="section-head"><h2>خدمات</h2></div>
          <div class="filters">
            <aside class="side">
              <form id="filterForm">

                <div class="field"><label>حداکثر قیمت</label><input name="max" type="number" value="${max || ""}" /></div>
                <div class="field"><label>حداقل امتیاز</label>
                  <select name="rate">
                    <option value="0">همه</option>
                    <option value="3" ${minRate === 3 ? "selected" : ""}>۳ به بالا</option>
                    <option value="4" ${minRate === 4 ? "selected" : ""}>۴ به بالا</option>
                    <option value="4.5" ${String(minRate) === "4.5" ? "selected" : ""}>۴.۵ به بالا</option>
                  </select>
                </div>
                <div class="field"><label>مرتب‌سازی</label>
                  <select name="sort">
                    <option value="new" ${sort === "new" ? "selected" : ""}>جدیدترین</option>
                    <option value="popular" ${sort === "popular" ? "selected" : ""}>محبوب‌ترین</option>
                    <option value="cheap" ${sort === "cheap" ? "selected" : ""}>ارزان‌ترین</option>

                <button class="btn btn-primary btn-block" type="submit">اعمال فیلتر</button>

            </div>
          </div>
        </section>`;
    }

    function cartTotals(items) {
      const rows = items.map(i => {
        const s = serviceOf(i.serviceId);
        return s ? { ...i, service: s, line: s.price * i.qty } : null;
      }).filter(Boolean);
      const sub = rows.reduce((a, b) => a + b.line, 0);
      const fee = Math.round(sub * FEE_RATE);
      return { rows, sub, fee, total: sub + fee };
    }

    function placeOrders(form) {
      const u = currentUser();
      const items = cartOf(u.id);
      const t = cartTotals(items);
      if (!t.rows.length) return;
      const created = [];
      const list = orders();
      t.rows.forEach(r => {
        if (u.role === "provider" && r.service.providerId === u.id) return;
        const code = "#V" + String(10000 + Math.floor(Math.random() * 89999));
        const fee = Math.round(r.line * FEE_RATE);
        list.push({
          id: uid("o_"),
          code,
          customerId: u.id,
          customerName: form.name,
          providerId: r.service.providerId,
          serviceId: r.service.id,
          title: r.service.title,
          qty: r.qty,
          price: r.line,
          fee,
          providerEarn: r.line,
          total: r.line + fee,
          status: "paid",
          notes: form.notes,
          when: form.when,
          pay: form.pay,
          createdAt: today(),
          onTime: true
        });
        created.push(code);
        const ss = services();
        const s = ss.find(x => x.id === r.service.id);
        if (s) { s.orderCount = (s.orderCount || 0) + 1; saveServices(ss); }
      });
      saveOrders(list);
      saveCart(u.id, []);
      location.hash = "#/order-success/" + encodeURIComponent(created[0] || "#V00000");
      toast("✓ سفارش با موفقیت ثبت شد");
    }

    function applyOrderStatus(id, to) {
      const u = currentUser();
      const list = orders();
      const o = list.find(x => x.id === id);
      if (!o) return;
      const allowed = {
        customer: { delivered: ["done", "revise"], pending: ["cancel"], paid: ["cancel"], progress: ["dispute"], delivered2: ["dispute"] },
        provider: { paid: ["progress"], progress: ["delivered"], revise: ["progress"], dispute: ["progress"] },
        admin: Object.keys(STATUS)
      };
      if (u.role === "admin") {
        o.status = to;
      } else if (u.id === o.customerId) {
        const ok = ["done", "revise", "cancel", "dispute"].includes(to);
        if (!ok) { toast("این تغییر برای مشتری مجاز نیست", "err"); return; }
        o.status = to;
      } else if (u.id === o.providerId) {
        if (!["progress", "delivered"].includes(to)) { toast("این تغییر برای ارائه‌دهنده مجاز نیست", "err"); return; }
        o.status = to;
      } else return;
      if (to === "done") completeOrderStats(o);
      if (to === "cancel") bumpCancel(o.providerId);
      saveOrders(list);
      toast("✓ وضعیت سفارش به‌روز شد");
      render();
    }

    function completeOrderStats(o) {
      if (o.countedDone) return;
      o.countedDone = true;
      const list = users();
      const p = list.find(u => u.id === o.providerId);
      if (!p) return;
      p.completedOrders = (p.completedOrders || 0) + 1;
      const done = orders().filter(x => x.providerId === p.id && (x.status === "done" || x.countedDone));
      const onTime = done.filter(x => x.onTime !== false).length;
      p.onTimePercent = done.length ? Math.round((onTime / done.length) * 100) : p.onTimePercent;
      p.level = levelOf(p.completedOrders);
      saveUsers(list);
    }

    function bumpCancel(providerId) {
      const list = users();
      const p = list.find(u => u.id === providerId);
      if (!p) return;
      const all = orders().filter(o => o.providerId === providerId);
      const canceled = all.filter(o => o.status === "cancel").length + 1;
      p.cancelPercent = all.length ? Math.round((canceled / Math.max(all.length, 1)) * 100) : p.cancelPercent;
      saveUsers(list);
    }

    function addReview(orderId, rating, text) {
      const u = currentUser();
      const o = orders().find(x => x.id === orderId);
      if (!u || !o || u.id !== o.customerId || o.status !== "done") {
        toast("فقط بعد از تکمیل سفارش می‌توانید نظر واقعی ثبت کنید", "err"); return;
      }
      if (u.id === o.providerId) { toast("امتیازدهی به خود مجاز نیست", "err"); return; }
      const reviews = db.get(KEYS.reviews, []);
      if (reviews.some(r => r.orderId === orderId)) { toast("برای این سفارش قبلاً نظر ثبت شده", "err"); return; }
      reviews.push({ id: uid("r_"), orderId, serviceId: o.serviceId, providerId: o.providerId, userId: u.id, rating: Number(rating), text, createdAt: today() });
      db.set(KEYS.reviews, reviews);
      recalcProviderRating(o.providerId);
      toast("✓ نظر شما ثبت شد");
      render();
    }

    function recalcProviderRating(providerId) {
      const reviews = db.get(KEYS.reviews, []).filter(r => r.providerId === providerId);
      const list = users();
      const p = list.find(u => u.id === providerId);
      if (!p) return;
      p.reviewCount = reviews.length;
      p.rating = reviews.length ? Math.round((reviews.reduce((a, b) => a + Number(b.rating), 0) / reviews.length) * 10) / 10 : 0;
      saveUsers(list);
      const ss = services();
      ss.filter(s => s.providerId === providerId).forEach(s => {
        const rs = reviews.filter(r => r.serviceId === s.id);
        if (rs.length) s.rating = Math.round((rs.reduce((a, b) => a + Number(b.rating), 0) / rs.length) * 10) / 10;
      });
      saveServices(ss);
    }

    function qs(obj) {
      const p = new URLSearchParams();
      Object.entries(obj).forEach(([k, v]) => { if (v !== "" && v != null) p.set(k, v); });
      const s = p.toString();
      return s ? "?" + s : "";
    }

    function render() {
      seedIfNeeded();
      closeMenu();
      renderNav();
      const { parts } = parseRoute();
      const root = parts[0] || "";
      const app = document.getElementById("app");
      const search = new URLSearchParams((location.hash.split("?")[1] || ""));
      const query = Object.fromEntries(search.entries());
      let html = "";
      if (!root) html = homeView();
      else if (root === "services") html = servicesView(query);
      else if (root === "service") html = serviceDetailView(parts[1]);
      else if (root === "provider") html = providerView(parts[1]);
      else if (root === "cart") html = cartView();
      else if (root === "checkout") html = checkoutView();
      else if (root === "order-success") html = successView(parts[1]);
      else if (root === "orders") html = ordersView();
      else if (root === "order") html = orderDetailView(parts[1]);
      else if (root === "favorites") html = favoritesView();
      else if (root === "feedback") html = feedbackView();
      else if (root === "login") html = loginView();
      else if (root === "register") html = registerView();
      else if (root === "account") html = accountView();
      else if (root === "provider-panel") html = providerPanelView(parts[1]);
      else if (root === "admin") html = adminView(parts[1]);
      else html = homeView();
      app.innerHTML = html;
      bind();
    }

    function bind() {
      document.getElementById("heroSearch")?.addEventListener("submit", e => {
        e.preventDefault();
        const q = e.target.q.value.trim();
        location.hash = "#/services" + qs({ q });
      });
      document.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
        location.hash = "#/services" + qs({ cat: btn.dataset.cat });
      }));
      document.getElementById("filterForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        location.hash = "#/services" + qs(Object.fromEntries(fd.entries()));
      });
      document.querySelectorAll("[data-add]").forEach(btn => btn.addEventListener("click", () => addToCart(btn.dataset.add, 1)));
      document.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => {
        const items = cartOf(activeCartId()).filter(i => i.serviceId !== btn.dataset.remove);
        saveCart(activeCartId(), items);
        toast("از سبد حذف شد");
        render();
      }));
      document.querySelectorAll("[data-qty]").forEach(btn => btn.addEventListener("click", () => {
        const items = cartOf(activeCartId());
        const it = items.find(i => i.serviceId === btn.dataset.qty);
        if (!it) return;
        it.qty += Number(btn.dataset.d);
        if (it.qty < 1) {
          saveCart(activeCartId(), items.filter(i => i.serviceId !== it.serviceId));
        } else saveCart(activeCartId(), items);
        render();
      }));
      document.getElementById("checkoutForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        placeOrders(Object.fromEntries(fd.entries()));
      });
      document.getElementById("favBtn")?.addEventListener("click", () => toggleFav(document.getElementById("favBtn").dataset.fav));
      document.getElementById("reportBtn")?.addEventListener("click", () => {
        const box = document.getElementById("reportBox");
        if (box) box.classList.toggle("hidden");
      });
      document.getElementById("reportForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const text = String(new FormData(e.target).get("text") || "").trim();
        if (!text) { toast("متن گزارش را بنویسید", "err"); return; }
        const reps = db.get(KEYS.reports, []);
        reps.push({ id: uid("rp_"), serviceId: e.target.dataset.sid, text, userId: (currentUser() || {}).id || "guest", createdAt: today() });
        db.set(KEYS.reports, reps);
        toast("✓ گزارش ثبت شد");
        e.target.reset();
        document.getElementById("reportBox")?.classList.add("hidden");
      });
      document.getElementById("fbForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const list = db.get(KEYS.feedback, []);
        list.push({ id: uid("f_"), type: fd.get("type"), text: fd.get("text"), userId: (currentUser() || {}).id || "guest", createdAt: today() });
        db.set(KEYS.feedback, list);
        toast("✓ بازخورد ارسال شد");
        e.target.reset();
      });
      document.getElementById("loginForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const email = String(fd.get("email")).trim().toLowerCase();
        const pass = hash(String(fd.get("password")));
        const u = users().find(x => x.email.toLowerCase() === email && x.pass === pass);
        if (!u) { toast("ایمیل یا رمز نادرست است", "err"); return; }
        db.set(KEYS.session, { userId: u.id });
        const guest = cartOf(guestCartKey());
        if (guest.length) {
          const mine = cartOf(u.id);
          guest.forEach(g => {
            const f = mine.find(x => x.serviceId === g.serviceId);
            if (f) f.qty += g.qty; else mine.push(g);
          });
          saveCart(u.id, mine);
          saveCart(guestCartKey(), []);
        }
        const guestFav = favOf(guestCartKey());
        if (guestFav.length) {
          const mineFav = Array.from(new Set(favOf(u.id).concat(guestFav)));
          saveFav(u.id, mineFav);
          saveFav(guestCartKey(), []);
        }
        toast("✓ وارد شدید");
        location.hash = u.role === "admin" ? "#/admin" : u.role === "provider" ? "#/provider-panel" : "#/";
        render();
      });
      document.getElementById("regForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const email = String(fd.get("email")).trim().toLowerCase();
        if (users().some(x => x.email.toLowerCase() === email)) { toast("این ایمیل قبلاً ثبت شده", "err"); return; }
        const role = fd.get("role");
        if (role === "admin") return;
        const u = {
          id: uid("u_"), name: fd.get("name"), email, pass: hash(String(fd.get("password"))),
          role, bio: "", avatar: "", verified: false, joinedAt: today(),
          rating: 0, completedOrders: 0, onTimePercent: 100, responseHours: 24,
          cancelPercent: 0, reviewCount: 0, level: "تازه‌کار"
        };
        const list = users(); list.push(u); saveUsers(list);
        db.set(KEYS.session, { userId: u.id });
        toast("✓ حساب ساخته شد");
        location.hash = role === "provider" ? "#/provider-panel" : "#/";
        render();
      });
      document.getElementById("logoutBtn")?.addEventListener("click", () => {
        localStorage.removeItem(KEYS.session);
        toast("خارج شدید");
        location.hash = "#/";
        render();
      });
      document.getElementById("addServiceForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const u = currentUser();
        if (!u || u.role !== "provider") return;
        const fd = new FormData(e.target);
        const file = e.target.image.files[0];
        const finish = (image) => {
          const list = services();
          list.unshift({
            id: uid("s_"), providerId: u.id, title: fd.get("title"), desc: fd.get("desc"),
            category: fd.get("category"), price: Number(fd.get("price")), deliveryDays: Number(fd.get("deliveryDays")),
            image: image || "", rating: 0, orderCount: 0, createdAt: today(), status: "active"
          });
          saveServices(list);
          toast("✓ خدمت ثبت شد");
          location.hash = "#/provider-panel/services";
          render();
        };
        if (file) {
          const reader = new FileReader();
          reader.onload = () => finish(reader.result);
          reader.readAsDataURL(file);
        } else finish("");
      });
      document.querySelector('input[name="image"]')?.addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = document.getElementById("previewImg");
          if (img) { img.src = reader.result; img.classList.remove("hidden"); }
        };
        reader.readAsDataURL(file);
      });
      document.getElementById("provProfile")?.addEventListener("submit", e => {
        e.preventDefault();
        const u = currentUser();
        const fd = new FormData(e.target);
        const list = users();
        const me = list.find(x => x.id === u.id);
        me.name = fd.get("name");
        me.bio = fd.get("bio");
        saveUsers(list);
        toast("✓ پروفایل ذخیره شد");
      });
      document.getElementById("reviewForm")?.addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        addReview(e.target.dataset.oid, fd.get("rating"), fd.get("text"));
      });
      document.querySelectorAll("[data-ostatus]").forEach(btn => btn.addEventListener("click", () => applyOrderStatus(btn.dataset.ostatus, btn.dataset.to)));
      document.querySelectorAll("[data-dels]").forEach(btn => btn.addEventListener("click", () => {
        const u = currentUser();
        const s = serviceOf(btn.dataset.dels);
        if (!s) return;
        if (!(u && (u.role === "admin" || u.id === s.providerId))) return;
        saveServices(services().filter(x => x.id !== s.id));
        toast("خدمت حذف شد");
        render();
      }));
      document.querySelectorAll("[data-delu]").forEach(btn => btn.addEventListener("click", () => {
        if (!requireRole(["admin"])) return;
        saveUsers(users().filter(x => x.id !== btn.dataset.delu));
        toast("کاربر حذف شد");
        render();
      }));
      document.querySelectorAll("[data-verify]").forEach(btn => btn.addEventListener("click", () => {
        if (!requireRole(["admin"])) return;
        const list = users();
        const p = list.find(x => x.id === btn.dataset.verify);
        if (p) { p.verified = !p.verified; saveUsers(list); toast("وضعیت تأیید تغییر کرد"); render(); }
      }));
      document.querySelectorAll("[data-stoggle]").forEach(btn => btn.addEventListener("click", () => {
        if (!requireRole(["admin"])) return;
        const list = services();
        const s = list.find(x => x.id === btn.dataset.stoggle);
        if (s) { s.status = s.status === "active" ? "hidden" : "active"; saveServices(list); render(); }
      }));
    }

    function closeMenu() {
      const nav = document.getElementById("mainNav");
      const backdrop = document.getElementById("navBackdrop");
      const btn = document.getElementById("menuBtn");
      nav.classList.remove("open");
      backdrop.classList.remove("show");
      document.body.classList.remove("menu-open");
      btn.setAttribute("aria-expanded", "false");
      btn.textContent = "منو";
    }
    function openMenu() {
      const nav = document.getElementById("mainNav");
      const backdrop = document.getElementById("navBackdrop");
      const btn = document.getElementById("menuBtn");
      nav.classList.add("open");
      backdrop.classList.add("show");
      document.body.classList.add("menu-open");
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "بستن";
    }
    document.getElementById("menuBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const nav = document.getElementById("mainNav");
      if (nav.classList.contains("open")) closeMenu();
      else openMenu();
    });
    document.getElementById("navBackdrop").addEventListener("click", closeMenu);
    document.getElementById("mainNav").addEventListener("click", (e) => {
      const item = e.target.closest("a, button");
      if (item) closeMenu();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMenu();
    });
    window.addEventListener("hashchange", render);
    seedIfNeeded();
    render();
  })();
  </script>
</body>
</html>
