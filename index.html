<style>
:root{--p:#2563eb;--s:#7c3aed;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--border:#e5e7eb;--danger:#ef4444;--ok:#16a34a;--shadow:0 10px 30px #0f172a14}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.container{width:min(1150px,92%);margin:auto}.nav{min-height:70px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--p),var(--s));color:transparent;background-clip:text}.search{flex:1;min-width:180px}.search input,.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);outline:0}.btn{border:0;border-radius:12px;padding:10px 15px}.primary{background:linear-gradient(135deg,var(--p),var(--s));color:#fff}.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.danger{background:var(--danger);color:#fff}.count{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px}.hero{margin:28px 0;padding:40px 25px;border-radius:25px;background:linear-gradient(135deg,var(--p),var(--s));color:#fff}.hero h1{font-size:clamp(30px,7vw,50px);margin:0}.hero p{margin:5px 0 20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cat{padding:14px 5px;border:1px solid var(--border);border-radius:15px;background:var(--card);color:var(--text)}.cat span{display:block;font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.pic{height:140px;display:grid;place-items:center;font-size:65px;background:linear-gradient(135deg,#2563eb18,#7c3aed18)}.body{padding:15px}.muted{color:var(--muted);font-size:13px}.meta{display:flex;justify-content:space-between;gap:8px;margin:10px 0}.price{font-weight:900;color:var(--p)}.empty{padding:30px;text-align:center;border:1px dashed var(--border);border-radius:16px;color:var(--muted);grid-column:1/-1}.modal{display:none;position:fixed;inset:0;z-index:100;background:#02061799;padding:15px;overflow:auto}.modal.show{display:flex;align-items:center;justify-content:center}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border-radius:20px;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);margin-bottom:15px}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.form{margin:10px 0}.form label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}.form textarea{min-height:100px}.cartitem,.row,.order{padding:12px;border:1px solid var(--border);border-radius:14px;margin:8px 0}.cartitem{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center}.qty{display:flex;gap:7px;align-items:center;margin-top:6px}.qty button{border:0;border-radius:8px;padding:3px 10px;background:var(--bg);color:var(--text)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;padding:14px;border:1px solid var(--border);border-radius:14px}.stat strong,.stat span{display:block}.role{display:inline-block;padding:3px 8px;border-radius:20px;background:#2563eb18;color:var(--p);font-size:12px}.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(20px);transition:.2s}.toast.show{opacity:1;transform:none}footer{margin-top:50px;padding:30px 0;border-top:1px solid var(--border);color:var(--muted)}body.dark{--bg:#0f172a;--card:#172033;--text:#f8fafc;--muted:#aab4c5;--border:#293548}body.dark header{background:#0f172aee}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.categories{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.search{order:5;flex-basis:100%}.nav{padding:10px 0}.categories{grid-template-columns:repeat(3,1fr)}}

<body>
<header><div class="container nav"><div class="logo">وارش</div><div class="search"><input id="search" placeholder="جستجوی خدمت..." oninput="searchServices()"></div><button class="btn secondary" onclick="toggleDark()">🌙</button><button class="btn secondary" onclick="showFavorites()">❤️</button><button class="btn secondary" onclick="openCart()">🛒 <b id="cartCount">0</b></button><button id="accountBtn" class="btn secondary" onclick="openAccount()">👤 ورود</button></div></header>

<section><div class="section-head"><h2>دسته‌بندی‌ها</h2><button class="btn secondary" onclick="showAll()">همه</button></div><div class="categories"><button class="cat" onclick="filterCategory('طراحی')"><span>🎨</span>طراحی</button><button class="cat" onclick="filterCategory('برنامه‌نویسی')"><span>💻</span>برنامه‌نویسی</button><button class="cat" onclick="filterCategory('تولید محتوا')"><span>📱</span>تولید محتوا</button><button class="cat" onclick="filterCategory('ترجمه')"><span>🌐</span>ترجمه</button><button class="cat" onclick="filterCategory('هنر')"><span>🖌️</span>هنر</button><button class="cat" onclick="filterCategory('سایر')"><span>✨</span>سایر</button></div></section>

<div id="serviceModal" class="modal"><div class="box"><div class="head"><h2>جزئیات خدمت</h2><button class="close" onclick="closeModal('serviceModal')">×</button></div><div id="details"></div></div></div>

<div id="accountModal" class="modal"><div class="box"><div class="head"><h2>👤 حساب</h2><button class="close" onclick="closeModal('accountModal')">×</button></div><div id="account"></div></div></div>
<div id="authModal" class="modal"><div class="box"><div class="head"><h2 id="authTitle">ورود به وارش</h2><button class="close" onclick="closeModal('authModal')">×</button></div><div class="actions" style="margin-bottom:12px"><button id="loginTab" class="btn primary" onclick="setAuthMode('login')">ورود</button><button id="signupTab" class="btn secondary" onclick="setAuthMode('signup')">ثبت‌نام</button></div><div id="nameWrap" class="form" style="display:none"><label>نام و نام خانوادگی</label><input id="name" autocomplete="name"></div><div class="form"><label>ایمیل</label><input id="email" type="email" autocomplete="email" inputmode="email"></div><div class="form"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div><button id="authSubmit" class="btn primary" onclick="submitAuth()">ورود به وارش</button><p id="authHint" class="muted">با ورود، حساب واقعی شما در Supabase مدیریت می‌شود.</p></div></div>
<div id="orderModal" class="modal"><div class="box"><div class="head"><h2>📦 سفارش‌ها</h2><button class="close" onclick="closeModal('orderModal')">×</button></div><div id="ordersBox"></div></div></div>
<div id="reviewModal" class="modal"><div class="box"><div class="head"><h2>⭐ ثبت نظر</h2><button class="close" onclick="closeModal('reviewModal')">×</button></div><div class="form"><label>امتیاز</label><select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="form"><label>نظر</label><textarea id="reviewText"></textarea></div><button class="btn primary" onclick="submitReview()">ثبت نظر</button></div></div>
<div id="serviceFormModal" class="modal"><div class="box"><div class="head"><h2 id="formTitle">خدمت جدید</h2><button class="close" onclick="closeModal('serviceFormModal')">×</button></div><input id="editId" type="hidden"><div class="form"><label>عنوان</label><input id="title"></div><div class="form"><label>دسته‌بندی</label><select id="category"><option>طراحی</option><option>برنامه‌نویسی</option><option>تولید محتوا</option><option>ترجمه</option><option>هنر</option><option>سایر</option></select></div><div class="form"><label>قیمت</label><input id="price" type="number"></div><div class="form"><label>توضیحات</label><textarea id="description"></textarea></div><div class="form"><label>آیکون</label><input id="icon" value="✨"></div><button class="btn primary" onclick="saveService()">ذخیره</button></div></div>
<div id="adminModal" class="modal"><div class="box"><div class="head"><h2>⚙️ مدیریت</h2><button class="close" onclick="closeModal('adminModal')">×</button></div><div id="admin"></div></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const defaults=[
{id:1,title:'طراحی لوگو اختصاصی',category:'طراحی',price:350000,icon:'🎨',description:'طراحی لوگوی اختصاصی و حرفه‌ای برای برند شما.',rating:4.8,reviews:12,sellerId:'demo',active:true},
{id:2,title:'طراحی بنر تبلیغاتی',category:'طراحی',price:180000,icon:'🖼️',description:'طراحی بنر مناسب شبکه‌های اجتماعی و تبلیغات.',rating:4.6,reviews:8,sellerId:'demo',active:true},
{id:3,title:'طراحی سایت',category:'برنامه‌نویسی',price:900000,icon:'💻',description:'طراحی سایت مدرن و واکنش‌گرا.',rating:4.9,reviews:17,sellerId:'demo',active:true},
{id:4,title:'تولید محتوای شبکه اجتماعی',category:'تولید محتوا',price:250000,icon:'📱',description:'تولید محتوای خلاقانه برای شبکه‌های اجتماعی.',rating:4.5,reviews:9,sellerId:'demo',active:true},
{id:5,title:'ترجمه فارسی و انگلیسی',category:'ترجمه',price:150000,icon:'🌐',description:'ترجمه متن فارسی و انگلیسی.',rating:4.7,reviews:6,sellerId:'demo',active:true},
{id:6,title:'تصویرسازی هنری',category:'هنر',price:220000,icon:'🖌️',description:'تصویرسازی دیجیتال برای پروژه‌های شخصی و تجاری.',rating:4.9,reviews:11,sellerId:'demo',active:true}
];
function read(k,d){try{let x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch(e){return d}}
let services=read('varesh_services',defaults),cart=read('varesh_cart',[]),favorites=read('varesh_favorites',[]),orders=read('varesh_orders',[]),users=read('varesh_users',[]),reviews=read('varesh_reviews',[]),user=read('varesh_user',null),reviewService=0;
if(!Array.isArray(services))services=defaults;if(!Array.isArray(cart))cart=[];if(!Array.isArray(favorites))favorites=[];if(!Array.isArray(orders))orders=[];if(!Array.isArray(users))users=[];if(!Array.isArray(reviews))reviews=[];
function save(){localStorage.setItem('varesh_services',JSON.stringify(services));localStorage.setItem('varesh_cart',JSON.stringify(cart));localStorage.setItem('varesh_favorites',JSON.stringify(favorites));localStorage.setItem('varesh_orders',JSON.stringify(orders));localStorage.setItem('varesh_users',JSON.stringify(users));localStorage.setItem('varesh_reviews',JSON.stringify(reviews));localStorage.setItem('varesh_user',JSON.stringify(user))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(x){return Number(x||0).toLocaleString('fa-IR')+' تومان'}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(id){document.getElementById(id)?.classList.add('show')}function closeModal(id){document.getElementById(id)?.classList.remove('show')}
function render(list=services.filter(s=>s.active!==false)){let b=document.getElementById('list');document.getElementById('info').textContent=list.length.toLocaleString('fa-IR')+' خدمت';if(!list.length){b.innerHTML='<div class="empty">خدمتی پیدا نشد.</div>';return}b.innerHTML=list.map(s=>`<article class="card"><div class="pic">${esc(s.icon)}</div><div class="body"><h3>${esc(s.title)}</h3><div class="muted">${esc(s.category)}</div><div class="meta"><span class="price">${money(s.price)}</span><span>⭐ ${Number(s.rating||0).toFixed(1)}</span></div><div class="muted">${esc(s.description)}</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="openService(${s.id})">مشاهده</button><button class="btn secondary" onclick="fav(${s.id})">${favorites.includes(s.id)?'❤️':'♡'}</button></div></div></article>`).join('')}
function normalizeText(x){return String(x??'').toLocaleLowerCase('fa-IR').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌‏‎]/g,'').replace(/\s+/g,' ').trim()}
function searchServices(){let q=normalizeText(document.getElementById('search').value);if(!q){render();return}let words=q.split(' ').filter(Boolean);let list=services.filter(s=>{if(s.active===false)return false;let text=normalizeText(`${s.title} ${s.description} ${s.category}`);return words.every(w=>text.includes(w))});render(list)}function filterCategory(c){render(services.filter(s=>s.active!==false&&s.category===c));document.getElementById('services').scrollIntoView({behavior:'smooth'})}function showAll(){document.getElementById('search').value='';render();scrollToServices()}function scrollToServices(){document.getElementById('services').scrollIntoView({behavior:'smooth'})}
function openService(id){let s=services.find(x=>x.id==id);if(!s)return;reviewService=id;let rs=reviews.filter(r=>r.serviceId==id);document.getElementById('details').innerHTML=`<div class="pic" style="border-radius:15px">${esc(s.icon)}</div><h2>${esc(s.title)}</h2><div class="muted">${esc(s.category)}</div><div class="meta"><b class="price">${money(s.price)}</b><span>⭐ ${Number(s.rating||0).toFixed(1)} (${s.reviews||0})</span></div><p>${esc(s.description)}</p><div class="actions"><button class="btn primary" onclick="add(${s.id});closeModal('serviceModal')">🛒 افزودن به سبد</button><button class="btn secondary" onclick="fav(${s.id})">❤️ علاقه‌مندی</button>${user?`<button class="btn secondary" onclick="openReview(${s.id})">⭐ ثبت نظر</button>`:''}</div><h3>نظرات</h3>${rs.length?rs.map(r=>`<div class="row"><b>${esc(r.name)}</b> · ⭐${r.rating}<p>${esc(r.text)}</p></div>`).join(''):'<div class="empty">هنوز نظری ثبت نشده است.</div>'}`;openModal('serviceModal')}
function fav(id){favorites.includes(id)?favorites=favorites.filter(x=>x!=id):favorites.push(id);save();render();toast(favorites.includes(id)?'به علاقه‌مندی اضافه شد.':'حذف شد.')}function showFavorites(){render(services.filter(s=>favorites.includes(s.id)&&s.active!==false));scrollToServices()}
function add(id){let x=cart.find(i=>i.id==id);x?x.qty++:cart.push({id,qty:1});save();count();toast('به سبد خرید اضافه شد.')}
function count(){document.getElementById('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0).toLocaleString('fa-IR')}
function openCart(){let b=document.getElementById('cart');if(!cart.length){b.innerHTML='<div class="empty">سبد خرید خالی است.</div>';openModal('cartModal');return}let total=0;b.innerHTML=cart.map(i=>{let s=services.find(x=>x.id==i.id);if(!s)return '';total+=s.price*i.qty;return `<div class="cartitem"><div>${esc(s.icon)}</div><div><b>${esc(s.title)}</b><div class="muted">${money(s.price)}</div><div class="qty"><button onclick="qty(${s.id},-1)">−</button>${i.qty}<button onclick="qty(${s.id},1)">+</button></div></div><button class="btn danger" onclick="removeItem(${s.id})">حذف</button></div>`}).join('')+`<div class="meta"><b>مجموع</b><b>${money(total)}</b></div><div class="actions"><button class="btn primary" onclick="placeOrder()">ثبت سفارش</button><button class="btn secondary" onclick="cart=[];save();count();openCart()">خالی کردن</button></div>`;openModal('cartModal')}
function qty(id,d){let x=cart.find(i=>i.id==id);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(i=>i.id!=id);save();count();openCart()}function removeItem(id){cart=cart.filter(i=>i.id!=id);save();count();openCart()}
function placeOrder(){if(!user){closeModal('cartModal');openAuth();toast('ابتدا وارد شوید.');return}if(!cart.length)return;let items=cart.map(i=>{let s=services.find(x=>x.id==i.id);return s?{id:s.id,title:s.title,price:s.price,qty:i.qty}:null}).filter(Boolean);let total=items.reduce((a,x)=>a+x.price*x.qty,0);orders.unshift({id:'VR-'+Date.now().toString().slice(-8),userId:user.id,userName:user.name,date:new Date().toLocaleString('fa-IR'),items,total,status:'در انتظار بررسی'});cart=[];save();count();closeModal('cartModal');toast('سفارش ثبت شد.');}
let authMode='login';
const SUPABASE_URL='https://rkctmoofnooaelvdqgqn.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_DmbqD9FjFJezMSelH9y16A_ibbaCtuZ';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
user=null;
function setAuthMode(mode){authMode=mode;document.getElementById('authTitle').textContent=mode==='login'?'ورود به وارش':'ساخت حساب وارش';document.getElementById('nameWrap').style.display=mode==='signup'?'block':'none';document.getElementById('password').autocomplete=mode==='signup'?'new-password':'current-password';document.getElementById('authSubmit').textContent=mode==='login'?'ورود به وارش':'ساخت حساب';document.getElementById('authHint').textContent=mode==='login'?'ایمیل و رمز عبور حساب وارش را وارد کنید.':'پس از ثبت‌نام، ممکن است برای تأیید ایمیل پیام تأیید دریافت کنید.';document.getElementById('loginTab').className='btn '+(mode==='login'?'primary':'secondary');document.getElementById('signupTab').className='btn '+(mode==='signup'?'primary':'secondary')}
function openAuth(mode='login'){setAuthMode(mode);openModal('authModal')}
async function submitAuth(){let n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;if(!e||!e.includes('@'))return toast('ایمیل معتبر وارد کنید.');if(p.length<6)return toast('رمز عبور باید حداقل ۶ کاراکتر باشد.');if(authMode==='signup'&&n.length<2)return toast('نام خود را وارد کنید.');document.getElementById('authSubmit').disabled=true;try{if(authMode==='signup'){let {data,error}=await supabaseClient.auth.signUp({email:e,password:p,options:{data:{name:n}}});if(error)throw error;closeModal('authModal');document.getElementById('name').value='';document.getElementById('email').value='';document.getElementById('password').value='';if(data.session){user=data.user;updateAuthUI();toast('حساب شما ساخته شد.')}else toast('ثبت‌نام انجام شد. ایمیل خود را برای تأیید بررسی کنید.')}else{let {data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error)throw error;user=data.user;closeModal('authModal');document.getElementById('email').value='';document.getElementById('password').value='';updateAuthUI();toast('ورود موفق بود.');openAccount()}}catch(err){let msg=err?.message||'خطایی رخ داد.';if(/invalid login credentials/i.test(msg))msg='ایمیل یا رمز عبور اشتباه است.';if(/user already registered/i.test(msg))msg='این ایمیل قبلاً ثبت شده است. از بخش ورود استفاده کنید.';toast(msg)}finally{document.getElementById('authSubmit').disabled=false}}
function displayName(){return user?.user_metadata?.name||user?.email?.split('@')[0]||'کاربر'}
function updateAuthUI(){let logged=!!user;document.getElementById('accountBtn').textContent=logged?'👤 '+displayName():'👤 ورود';let h=document.getElementById('heroAuthBtn');if(h)h.textContent=logged?'حساب من':'ورود / ثبت‌نام'}
async function restoreSession(){let {data}=await supabaseClient.auth.getSession();user=data?.session?.user||null;updateAuthUI();if(user){document.getElementById('name').value=displayName();}supabaseClient.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;updateAuthUI();})}
function openAccount(){let b=document.getElementById('account');if(!user){b.innerHTML='<div class="empty">هنوز وارد حساب کاربری نشده‌اید.</div><button class="btn primary" onclick="closeModal(\'accountModal\');openAuth(\'login\')">ورود</button><button class="btn secondary" onclick="closeModal(\'accountModal\');openAuth(\'signup\')">ثبت‌نام</button>';openModal('accountModal');return}let role='خریدار';b.innerHTML=`<div class="row"><h2>${esc(displayName())}</h2><div>${esc(user.email||'')}</div><span class="role">${role}</span></div><div class="actions"><button class="btn secondary" onclick="myOrders()">📦 سفارش‌ها</button><button class="btn secondary" onclick="showFavorites();closeModal('accountModal')">❤️ علاقه‌مندی‌ها</button><button class="btn secondary" onclick="openProfileSettings()">⚙️ تنظیمات حساب</button><button class="btn danger" onclick="logout()">خروج</button></div><p class="muted">حساب شما با ایمیل یکتا در Supabase مدیریت می‌شود. امکانات فروشندگی و مدیریت در مرحله بعد به حساب اضافه می‌شوند.</p>`;openModal('accountModal')}
function openProfileSettings(){toast('تنظیمات کامل حساب را در مرحله بعد اضافه می‌کنیم.')}
async function logout(){await supabaseClient.auth.signOut();user=null;updateAuthUI();closeModal('accountModal');toast('از حساب خارج شدید.')}
function myOrders(){if(!user)return;let list=orders.filter(o=>o.userId===user.id);document.getElementById('ordersBox').innerHTML=list.length?list.map(o=>`<div class="order"><b>${esc(o.id)}</b><div class="muted">${esc(o.date)}</div><p>${o.items.map(x=>esc(x.title)).join('، ')}</p><div class="meta"><span>${money(o.total)}</span><span>${esc(o.status)}</span></div>${o.status!=='لغو شده'&&o.status!=='تکمیل شده'?`<button class="btn danger" onclick="cancelOrder('${o.id}')">لغو</button>`:''}</div>`).join(''):'<div class="empty">هنوز سفارشی ندارید.</div>';openModal('orderModal')}
function cancelOrder(id){let o=orders.find(x=>x.id===id&&x.userId===user.id);if(!o)return;o.status='لغو شده';save();myOrders();toast('سفارش لغو شد.')}
function openReview(id){if(!user)return;reviewService=id;document.getElementById('reviewText').value='';openModal('reviewModal')}function submitReview(){let t=document.getElementById('reviewText').value.trim(),r=+document.getElementById('rating').value;if(!t)return toast('نظر را بنویسید.');reviews.push({id:Date.now(),serviceId:reviewService,name:user.name,rating:r,text:t});let s=services.find(x=>x.id==reviewService);if(s){let n=s.reviews||0;s.rating=((s.rating||0)*n+r)/(n+1);s.reviews=n+1}save();closeModal('reviewModal');openService(reviewService);toast('نظر ثبت شد.')}
function seller(){if(!user||user.role!=='seller')return toast('دسترسی فروشنده لازم است.');let own=services.filter(s=>s.sellerId===user.id),b=document.getElementById('account');b.innerHTML=`<button class="btn primary" onclick="formService()">➕ افزودن خدمت</button><h3>خدمات من</h3>${own.length?own.map(s=>`<div class="row"><b>${esc(s.title)}</b><div class="muted">${money(s.price)} · ${s.active===false?'غیرفعال':'فعال'}</div><div class="actions"><button class="btn secondary" onclick="formService(${s.id})">ویرایش</button><button class="btn secondary" onclick="toggleService(${s.id})">${s.active===false?'فعال':'غیرفعال'}</button><button class="btn danger" onclick="delService(${s.id})">حذف</button></div></div>`).join(''):'<div class="empty">خدمتی ندارید.</div>'}`;openModal('accountModal')}
function formService(id){let s=id?services.find(x=>x.id==id):null;document.getElementById('editId').value=s?.id||'';document.getElementById('title').value=s?.title||'';document.getElementById('category').value=s?.category||'طراحی';document.getElementById('price').value=s?.price||'';document.getElementById('description').value=s?.description||'';document.getElementById('icon').value=s?.icon||'✨';document.getElementById('formTitle').textContent=s?'ویرایش خدمت':'خدمت جدید';openModal('serviceFormModal')}
function saveService(){if(!user||user.role!=='seller')return;let id=document.getElementById('editId').value,t=document.getElementById('title').value.trim(),c=document.getElementById('category').value,p=+document.getElementById('price').value,d=document.getElementById('description').value.trim(),i=document.getElementById('icon').value.trim()||'✨';if(!t||p<0||!d)return toast('اطلاعات را کامل کنید.');if(id){let s=services.find(x=>x.id==id&&x.sellerId===user.id);if(s)Object.assign(s,{title:t,category:c,price:p,description:d,icon:i})}else services.unshift({id:Date.now(),title:t,category:c,price:p,description:d,icon:i,rating:0,reviews:0,sellerId:user.id,active:true});save();closeModal('serviceFormModal');render();seller();toast('خدمت ذخیره شد.')}
function delService(id){services=services.filter(s=>!(s.id==id&&s.sellerId===user.id));cart=cart.filter(x=>x.id!=id);save();count();render();seller()}function toggleService(id){let s=services.find(x=>x.id==id&&x.sellerId===user.id);if(s)s.active=s.active===false;save();render();seller()}
function admin(){if(!user||user.role!=='admin')return toast('دسترسی مدیر لازم است.');let b=document.getElementById('admin'),sc=users.filter(u=>u.role==='seller').length;b.innerHTML=`<div class="stats"><div class="stat">👥<strong>${users.length}</strong>کاربر</div><div class="stat">🧑‍💻<strong>${sc}</strong>فروشنده</div><div class="stat">🛍️<strong>${services.length}</strong>خدمت</div><div class="stat">📦<strong>${orders.length}</strong>سفارش</div></div><h3>خدمات</h3>${services.map(s=>`<div class="row"><b>${esc(s.title)}</b><small>${money(s.price)}</small><button class="btn danger" onclick="adminDelete(${s.id})">حذف</button></div>`).join('')||'<div class="empty">خدمتی نیست.</div>'}<h3>سفارش‌ها</h3>${orders.map(o=>`<div class="row"><b>${esc(o.id)}</b><small>${esc(o.userName)}</small><select onchange="adminStatus('${o.id}',this.value)">${['در انتظار بررسی','تأیید شده','در حال انجام','تکمیل شده','لغو شده'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<div class="empty">سفارشی نیست.</div>'}`;openModal('adminModal')}
function adminDelete(id){if(confirm('این خدمت حذف شود؟')){services=services.filter(s=>s.id!=id);cart=cart.filter(x=>x.id!=id);favorites=favorites.filter(x=>x!=id);save();count();render();admin()}}function adminStatus(id,st){let o=orders.find(x=>x.id===id);if(o){o.status=st;save();admin();toast('وضعیت تغییر کرد.')}}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('varesh_dark',document.body.classList.contains('dark')?'1':'0')}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show'))});if(localStorage.getItem('varesh_dark')==='1')document.body.classList.add('dark');save();render();count();restoreSession();
</script></body></html>
